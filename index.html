<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Routine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  <meta name="theme-color" content="#40916c" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#40916c",
            "background-light": "#f7f9f7",
            "background-dark": "#112119",
            "header-text": "#2d6a4f",
            "accent": "#40916c",
            "row-light": "#ffffff",
            "row-dark": "#f0f0f0",
            "highlight-light": "#dcfce7",
            "highlight-dark": "#14532d",
            "highlight-border-light": "#22c55e",
            "highlight-border-dark": "#4ade80",
          },
          fontFamily: {
            "display": ["'Noto Sans Bengali'", "Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <style>
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #f7f9f7;
    }
    .dark body {
      background-color: #112119;
      color: #e2e8f0;
    }
    .current-routine-highlight {
      background-color: #dcfce7;
    }
    .dark .current-routine-highlight {
      background-color: #14532d;
    }
    
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      header, .day-selector-container, .side-menu-container, button, [contenteditable="true"] {
        display: none !important;
      }
      main {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
      }
      .routine-table-container, .dopamine-checklist-container, .score-explanation-container {
        box-shadow: none !important;
        border: 1px solid #ccc;
        margin-top: 1rem;
      }
      .dark body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      .dark .routine-table-container, .dark .dopamine-checklist-container, .dark .score-explanation-container {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      h1, h2, h3, h4, p, span, th, td {
        color: #000000 !important;
      }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
